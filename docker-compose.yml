# AI-Powered YouTube Video Summarizer — local build/run for the demo.
# One command runs the whole app:  docker compose up --build
# Frontend: http://localhost:5173   Backend: http://localhost:4000

services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    environment:
      # inside the compose network the backend is reachable as "backend"
      - VITE_PROXY_TARGET=http://backend:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend
